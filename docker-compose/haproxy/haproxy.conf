global
    maxconn 50000
    log stdout format raw local0
    user root
    group root
    nbthread 4
    cpu-map auto:1/1-4 0-3
    ssl-default-bind-options ssl-min-ver TLSv1.1

defaults
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    log global
    mode http
    option httplog
    maxconn 3000
    default_backend no-match

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend all
    bind 0.0.0.0:443 ssl crt /etc/ssl/certs/registraduria.tls.pem
    use_backend keycloak-backend if { path_beg /idp }
    use_backend keycloak-backend if { path_beg /.well-known/oauth-authorization-server/idp/realms/pid-registraduria-realm }
    use_backend keycloak-backend if { path_beg /.well-known/openid-configuration/idp/realms/pid-registraduria-realm }
    use_backend registraduria-backend if { path_beg /.well-known/openid-credential-issuer/pid-registraduria }
    use_backend registraduria-backend if { path_beg /.well-known/oauth-protected-resource/pid-registraduria }
    use_backend registraduria-backend if { path_beg /.well-known/jwt-vc-issuer/pid-registraduria }
    use_backend registraduria-metadata if { path /.well-known/jwt-issuer/pid-registraduria }
    # Canje interno de tickets (solo red docker: lo llama Keycloak). Nunca se expone al exterior.
    http-request deny deny_status 404 if { path_beg /pid-registraduria/internal/ }
    use_backend registraduria-backend if { path_beg /pid-registraduria }
    use_backend status-list-backend if { path_beg /token_status_list }

backend keycloak-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    option forwarded proto host by by_port for
    http-request set-path /idp/realms/pid-registraduria-realm/.well-known/oauth-authorization-server if { path_beg /.well-known/oauth-authorization-server/idp/realms/pid-registraduria-realm }
    http-request set-path /idp/realms/pid-registraduria-realm/.well-known/openid-configuration if { path_beg /.well-known/openid-configuration/idp/realms/pid-registraduria-realm }
    server server1 keycloak:8080 cookie server1 resolvers docker init-addr libc,none

backend registraduria-metadata
    http-request return status 200 content-type application/json lf-string "{\"issuer\":\"https://civica-desarrollo.avance.org.co/pid-registraduria\",\"jwks_uri\":\"https://civica-desarrollo.avance.org.co/pid-registraduria/public_keys.jwks\"}"

backend registraduria-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    option forwarded proto host by by_port for
    http-request set-path /pid-registraduria/.well-known/openid-credential-issuer if { path_beg /.well-known/openid-credential-issuer/pid-registraduria }
    http-request set-path /pid-registraduria/.well-known/oauth-protected-resource if { path_beg /.well-known/oauth-protected-resource/pid-registraduria }
    http-request set-path /pid-registraduria/.well-known/jwt-vc-issuer if { path_beg /.well-known/jwt-vc-issuer/pid-registraduria }
    server server1 pid-issuer:8080 cookie server1 resolvers docker init-addr libc,none

backend status-list-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    option forwarded proto host by by_port for
    server server1 status-list:5000 cookie server1 resolvers docker init-addr libc,none

backend no-match
    http-request deny deny_status 404
